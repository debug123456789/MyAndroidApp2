name: Build APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: '35.0.0'
          ndk-version: '27.0.12077973'
          cmake-version: '3.22.1'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      - name: Setup Gradle tmpdir
        run: |
          mkdir -p "$RUNNER_TEMP/nexshizuku-tmp"
          test -d "$RUNNER_TEMP/nexshizuku-tmp"
          test -w "$RUNNER_TEMP/nexshizuku-tmp"
          echo "GRADLE_TMPDIR=$RUNNER_TEMP/nexshizuku-tmp" >> $GITHUB_ENV
          echo "TMPDIR=$RUNNER_TEMP/nexshizuku-tmp" >> $GITHUB_ENV
      
      - name: Verify Gradle Wrapper
        run: ./gradlew --version
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp -Xmx1024m"
          _JAVA_OPTIONS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp"
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp -Xmx1024m"
          _JAVA_OPTIONS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp"
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp -Xmx1024m"
          _JAVA_OPTIONS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp"
      
      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp -Xmx1024m"
          _JAVA_OPTIONS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp"
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexshizuku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: '35.0.0'
          ndk-version: '27.0.12077973'
          cmake-version: '3.22.1'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      - name: Setup Gradle tmpdir
        run: |
          mkdir -p "$RUNNER_TEMP/nexshizuku-tmp"
          test -d "$RUNNER_TEMP/nexshizuku-tmp"
          test -w "$RUNNER_TEMP/nexshizuku-tmp"
          echo "GRADLE_TMPDIR=$RUNNER_TEMP/nexshizuku-tmp" >> $GITHUB_ENV
          echo "TMPDIR=$RUNNER_TEMP/nexshizuku-tmp" >> $GITHUB_ENV
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp -Xmx1024m"
          _JAVA_OPTIONS: "-Djava.io.tmpdir=$RUNNER_TEMP/nexshizuku-tmp"
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexshizuku-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
